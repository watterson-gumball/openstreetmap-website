<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login – ETK x Zvartnots</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f3f6fa;
      color: #2c3e50;
    }
    .topbar {
      background: #1f1f1f;
      display: flex;
      align-items: center;
      padding: 14px 32px;
      height: 64px;
    }
    .topbar .left { display: flex; align-items: center; gap: 24px; }
    .topbar img { height: 40px; }
    .topbar .links {
      display: flex; gap: 28px; margin-left: 32px;
    }
    .topbar .links a {
      color: #ccc; text-decoration: none; font-weight: 500;
    }
    .topbar .links a:hover { color: #fff; }

    .container {
      margin: 80px auto; display: flex;
      width: 880px; height: 520px;
      background: #fff; border-radius: 16px;
      box-shadow: 0 12px 48px rgba(0,0,0,0.08);
      overflow: hidden;
    }
    .form-section {
      flex: 3; padding: 40px;
      display: flex; flex-direction: column; justify-content: center;
    }
    .form-section h2 {
      font-size: 26px; color: #1a237e; margin-bottom: 28px;
    }
    .form-group { margin-bottom: 18px; }
    .form-group label {
      display: block; font-size: 14px; margin-bottom: 6px;
    }
    .form-group input {
      width: 100%; padding: 12px;
      border: 1px solid #ccd6e0; border-radius: 8px;
    }
    .forgot-password {
      text-align: right; font-size: 12px; margin: 6px 0 20px;
    }
    .forgot-password a { color: #f57c00; text-decoration: none; }
    .sign-in-btn {
      width: 100%; padding: 12px;
      background: #1a237e; color: #fff;
      border: none; border-radius: 8px;
      font-weight: bold; font-size: 15px;
    }
    .signup-link {
      margin-top: 20px; text-align: center;
      font-size: 13px; color: #555;
    }
    .signup-link a {
      color: #f57c00; font-weight: bold;
      text-decoration: none;
    }
    .image-section {
      flex: 2;
      background: url("image/zvartnoc.jpg") center/cover no-repeat;
    }

    .footer {
      background: #1f1f1f; color: #fff;
      padding: 32px;
      width: 500px;
    }
    .footer-content {
      max-width: 880px; margin: 0 auto;
    }
    .footer-content h2 {
      font-size: 18px; margin-bottom: 8px;
      color: #f57c00;
    }
    .footer-content h3 {
      font-size: 15px; margin-bottom: 20px;
      font-weight: 600;
    }
    .footer-body {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .contact-list {
      list-style: none;
      padding: 0;
    }
    .contact-list li {
      display: flex;
      align-items: center;
      font-size: 14px;
      margin-bottom: 12px;
      color: #ccc;
    }
    .contact-list svg {
      width: 18px;
      height: 18px;
      margin-right: 10px;
      fill: white;
    }
    .contact-list a {
      color: #f57c00; text-decoration: none;
    }
    .contact-list a:hover { text-decoration: underline; }

    .footer-icons {
      display: flex; gap: 14px; margin-top: 4px;
    }
    .footer-icons svg {
      width: 30px; height: 30px;
      background: #fff; border-radius: 50%; padding: 4px;
    }

    @media (max-width: 768px) {
      .container { flex-direction: column; height: auto; }
      .image-section { height: 200px; }
      .footer-body { flex-direction: column; gap: 24px; }
    }
  </style>
</head>
<body>

<!-- Login Box -->
<div class="container">
  <div class="form-section">
    <h2>Sign in</h2>
    <form>
      <div class="form-group">
        <label for="email">Your email</label>
        <input type="email" id="email" placeholder="you@etk.am" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      <div class="forgot-password">
        <a href="#">Forgot password?</a>
      </div>
      <button type="submit" class="sign-in-btn">Sign in</button>
    </form>
    <div class="signup-link">
      Don’t have an account? <a href="#">Sign up</a>
    </div>
  </div>
  <div class="image-section"></div>
</div>
